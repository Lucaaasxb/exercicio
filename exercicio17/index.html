<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classificação de Filmes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">

  <div class="container py-5">
    <h1 class="text-center mb-4">🎬 Classificação de Filmes</h1>

    <div id="movieList" class="mb-4"></div>

    <div class="input-group mb-3">
      <input type="text" id="movieInput" class="form-control" placeholder="Digite o nome do filme">
      <button class="btn btn-success" id="addMovieBtn">Adicionar Filme</button>
    </div>

    <hr>

    <h3>⭐ Filmes Classificados</h3>
    <ul id="ratedMovies" class="list-group mt-3"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
