<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acréscimo e Desconto</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container text-center">
    <h3 class="mb-4">Acréscimo e Desconto</h3>
    
    <div class="mb-3">
      <input id="valor" type="number" class="form-control" placeholder="Valor total">
    </div>
    <div class="mb-3">
      <input id="porcentagem" type="number" class="form-control" placeholder="Porcentagem (%)">
    </div>
    <div class="mb-3">
      <select id="operacao" class="form-select">
        <option value="acrescimo">Acréscimo</option>
        <option value="desconto">Desconto</option>
      </select>
    </div>

    <button id="btnCalcular" class="btn btn-success w-100">Calcular</button>

    <h4 class="mt-4">Resultado: <span id="resultado">--</span></h4>
  </div>

  <script src="app.js"></script>
</body>
</html>
